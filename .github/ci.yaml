name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install ruff
        run: uv pip install --system ruff
      - name: Lint
        run: ruff check airflow/dags/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Run unit tests
        run: pytest tests/ -v --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  dag-integrity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install Airflow (pin to match your deployment's version)
        run: |
          AIRFLOW_VERSION=3.2.2
          PYTHON_VERSION="$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          uv pip install --system "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
          uv pip install --system -r requirements.txt
      - name: Check the DAG file imports cleanly
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'airflow/dags')
          import importlib
          importlib.import_module('pipeline')
          print('DAG module imported without errors')
          "
